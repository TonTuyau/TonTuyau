# TonTuyau's pull requests (QA13-1, QA13-2; 2.3.0: the version tags have their own, release.yml). Runs only on pull
# requests to main and to the release branches, to save GitHub Actions minutes: pushing a branch runs nothing, opening
# or updating its pull request does. The checks (checks.yml: scripts/check.sh's stages), then both images built and
# run, never pushed (images.yml). A pull request that changes nothing but frontend/ (C1) skips the backend's checks.
name: CI

on:
  pull_request:
    # main, and the release branches (release/X.Y.Z gathers a version's steps, tried as alphas before main).
    branches: [main, "release/**"]
    # A pull request that changes only documentation runs nothing: nothing it checks reads them (the front's Prettier
    # sees no Markdown file). Any other file changed with them, and it runs.
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  # A newer push to an open pull request replaces its running checks.
  cancel-in-progress: true

jobs:
  # What the pull request changes (C1): only frontend/ (documentation doesn't count, nothing checks it), and the
  # backend isn't checked; anything else, and it is.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The pull request's merge commit and its first parent, the base branch: what the pull request changes.
          fetch-depth: 2

      - name: Backend concerned?
        id: scope
        run: |
          backend=false
          while IFS= read -r file; do
            case "$file" in
              frontend/* | docs/* | *.md) ;;
              *) backend=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "Backend checked: $backend"

  checks:
    name: Checks
    needs: changes
    uses: ./.github/workflows/checks.yml
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' }}

  images:
    name: Images
    needs: checks
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      push: false
