# TonTuyau CI (QA13-1, QA13-2). Runs only on pull requests to main and on version tags, to
# save GitHub Actions minutes: pushing a branch runs nothing, opening or updating its pull request does. Each run does
# the same checks as scripts/check.sh (the backend and the front as two jobs side by side), then builds both images. Images are pushed to GHCR only from a version tag,
# when everything passed (the tag must match the version in the code):
#   vX.Y.Z                         → `X.Y.Z`, `X.Y` and `latest`
#   vX.Y.Z-alpha.N / -beta.N / -rc.N → only `X.Y.Z-alpha.N`: never `latest`, `X` or `X.Y`
# then the tag's GitHub Release is made, its notes docs/releases/X.Y.Z.md (a pre-release, without its own notes:
# GitHub's list of what was merged since the tag before).
# A pull request builds the images and never pushes them. One that changes nothing but frontend/ (C1) skips the
# backend's checks; anything else changed, or a tag, checks both.
name: CI

on:
  pull_request:
    # main, and the release branches (release/X.Y.Z gathers a version's steps, tried as alphas before main).
    branches: [main, "release/**"]
    # A pull request that changes only documentation runs nothing: nothing it checks reads them (the front's Prettier
    # sees no Markdown file). Any other file changed with them, and it runs. A tag always runs.
    paths-ignore: ["docs/**", "**.md"]
  push:
    # v1.2.3 and the pre-releases v1.3.0-alpha.1, -beta.1, -rc.1 (a glob: `*` matches the "-alpha" part too).
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push to an open pull request replaces its running check; a tag's run always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # What a pull request changes (C1): only frontend/ (documentation doesn't count, nothing checks it), and the backend
  # isn't checked; anything else, and it is. A tag checks everything, after its version is checked against the code.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request's merge commit and its first parent, the base branch: what the pull request changes.
          fetch-depth: 2

      - name: Version tag matches the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Backend concerned?
        id: scope
        run: |
          backend=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            backend=false
            while IFS= read -r file; do
              case "$file" in
                frontend/* | docs/* | *.md) ;;
                *) backend=true ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "Backend checked: $backend"

  # Format, build, unit + Reqnroll tests (Testcontainers starts Elasticsearch and PostgreSQL on the runner's Docker).
  backend:
    name: Backend (scripts/check.sh --backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # The SDK backend/global.json pins (10.0.401, latest feature band allowed).
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The tests of a video played in parts (C3) run the real ffmpeg (the images carry their own).
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: scripts/check.sh --backend
        run: ./scripts/check.sh --backend

  # Lint, typecheck, tests (including the front server's), build, and the built page against the CSP.
  frontend:
    name: Frontend (scripts/check.sh --frontend)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # pnpm at the version frontend/package.json pins ("packageManager").
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: scripts/check.sh --frontend
        run: ./scripts/check.sh --frontend

  images:
    name: Image ${{ matrix.image }}
    needs: [changes, backend, frontend]
    # The backend's checks skipped (a front-only pull request) don't stop the images; failed or canceled, they do.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.frontend.result == 'success'
      && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    env:
      PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          echo "version=$(./scripts/check-version.sh)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(./scripts/check-version.sh --prerelease)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tontuyau/tontuyau-${{ matrix.image }}
          # Pre-releases, written out rather than left to the action's rules. On its own, metadata-action
          # gives a pre-release tag such as v1.3.0-alpha.1 only `{{version}}` (it turns `{{major}}.{{minor}}` into the
          # full version too), and its `latest=auto` skips pre-releases; but the `latest` below is ours, so it must be
          # switched off by hand. Hence `latest=false` and every moving tag enabled for a release only.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.prerelease == 'false' }}
            type=ref,event=pr
          # Written out rather than taken from the repository (its name and description), so the images say
          # TonTuyau and point at github.com/TonTuyau/TonTuyau whatever the repository is called when CI runs.
          labels: |
            org.opencontainers.image.title=TonTuyau ${{ matrix.image }}
            org.opencontainers.image.description=TonTuyau's ${{ matrix.image }}: a self-hosted, YouTube-like video library
            org.opencontainers.image.source=https://github.com/TonTuyau/TonTuyau
            org.opencontainers.image.url=https://github.com/TonTuyau/TonTuyau
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built into the runner's Docker first, to run what the image carries (1.5.1: no shell in them, so a program
      # missing a library would only show when it runs); pushed after, from the build cache.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          load: true
          tags: tontuyau-${{ matrix.image }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Run what the image carries
        run: scripts/smoke-image.sh ${{ matrix.image }} tontuyau-${{ matrix.image }}:ci

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # A version tag's GitHub Release (2.0.0), once both images are published: titled "TonTuyau X.Y.Z", its notes
  # docs/releases/X.Y.Z.md, or GitHub's list of what was merged since the tag before when there are none (the alphas).
  # A pre-release is marked as one, so it never becomes the latest release.
  release:
    name: GitHub Release
    needs: images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(./scripts/check-version.sh "$GITHUB_REF_NAME")"
          notes=(--generate-notes)
          if [ -f "docs/releases/$version.md" ]; then notes=(--notes-file "docs/releases/$version.md"); fi
          kind=()
          if [ "$(./scripts/check-version.sh --prerelease)" = true ]; then kind=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "TonTuyau $version" --verify-tag "${notes[@]}" "${kind[@]}"
