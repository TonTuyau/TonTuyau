# The monthly rebuild (1.5.1): the latest release's images, built again from the same sources on freshly pulled base
# images (Ubuntu, Node, .NET), so their security fixes reach whoever runs TonTuyau without waiting for a release.
# TonTuyau's code doesn't change: the same tag, the same commit. The 15th of each month, a few days after Microsoft's
# monthly .NET fixes (the second Tuesday); or by hand (Actions → Rebuild the latest release → Run workflow).
# The images are pushed only when what they carry runs (scripts/smoke-image.sh), under the release's own tags: `X.Y.Z`,
# `X.Y` and `latest`. Pre-releases are never rebuilt.
name: Rebuild the latest release

on:
  schedule:
    - cron: "0 4 15 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      # This workflow's own scripts (the default branch), and every tag, to find the latest release.
      - uses: actions/checkout@v5
        with:
          path: ci
          fetch-depth: 0

      - name: The latest release
        id: release
        working-directory: ci
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          [ -n "$tag" ] || { echo "No release tag." >&2; exit 1; }
          version="${tag#v}"
          revision="$(git rev-list -n 1 "$tag")"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"
          echo "Rebuilding $tag ($revision)."

      # The release's sources, as tagged.
      - uses: actions/checkout@v5
        with:
          path: src
          ref: ${{ steps.release.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tontuyau/tontuyau-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=TonTuyau ${{ matrix.image }}
            org.opencontainers.image.description=TonTuyau's ${{ matrix.image }}: a self-hosted, YouTube-like video library
            org.opencontainers.image.source=https://github.com/TonTuyau/TonTuyau
            org.opencontainers.image.url=https://github.com/TonTuyau/TonTuyau
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      # Fresh base images (pull), no build cache: every layer is built again on them.
      - uses: docker/build-push-action@v6
        with:
          context: src
          file: src/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          tags: tontuyau-${{ matrix.image }}:rebuild
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ steps.release.outputs.revision }}

      - name: Run what the image carries
        run: ci/scripts/smoke-image.sh ${{ matrix.image }} tontuyau-${{ matrix.image }}:rebuild

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push under the release's tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag "tontuyau-${{ matrix.image }}:rebuild" "$tag"
            docker push "$tag"
          done
