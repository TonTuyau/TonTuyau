# The monthly rebuild (1.5.1): the latest release's images, built again from the same sources on freshly pulled base
# images (Ubuntu, Node, .NET), so their security fixes reach whoever runs TonTuyau without waiting for a release.
# TonTuyau's code doesn't change: the same tag, the same commit. The 15th of each month, a few days after Microsoft's
# monthly .NET fixes (the second Tuesday); or by hand (Actions → Rebuild the latest release → Run workflow).
# The images are pushed only when what they carry runs (images.yml, as for a release), under the release's own tags:
# `X.Y.Z`, `X.Y` and `latest`. Pre-releases are never rebuilt.
name: Rebuild the latest release

on:
  schedule:
    - cron: "0 4 15 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  release:
    name: The latest release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      tags: ${{ steps.release.outputs.tags }}
    steps:
      # Every tag, to find the latest release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: The latest release
        id: release
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          [ -n "$tag" ] || { echo "No release tag." >&2; exit 1; }
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "tags=$version ${version%.*} latest"
          } >> "$GITHUB_OUTPUT"
          echo "Rebuilding $tag ($(git rev-list -n 1 "$tag"))."

  images:
    name: Images
    needs: release
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      tags: ${{ needs.release.outputs.tags }}
      push: true
      fresh: true
